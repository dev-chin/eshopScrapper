name: Scrap eshops & process

# Controls when the action will run.
on:
  workflow_run:
    workflows: ["Scrap valid NSUIDs"]
    types:
      - completed
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Grant GITHUB_TOKEN permissions to write to the repository
    permissions:
      contents: write

    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Set up the newest Python 3 version
      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Download titledb file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Last commit date (ISO 8601, UTC) touching a file in a repo; empty on failure
          last_commit() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$1/commits?path=$2&sha=master&per_page=1" \
              | jq -r '.[0].commit.committer.date // empty' 2>/dev/null || true
          }

          for f in US.en.json BR.pt.json CA.en.json AR.es.json CL.es.json CO.es.json \
                   PE.es.json MX.es.json HK.zh.json AU.en.json NZ.en.json JP.ja.json; do
            blawar=$(last_commit blawar/titledb "$f")
            bth=$(last_commit borntohonk/titledb "$f")
            # ISO 8601 UTC timestamps compare correctly as strings
            if [[ -n "$bth" && ( -z "$blawar" || "$bth" > "$blawar" ) ]]; then
              repo=borntohonk/titledb
            else
              repo=blawar/titledb
            fi
            echo "$f: blawar=${blawar:-?} borntohonk=${bth:-?} -> using $repo"
            wget --tries=0 --retry-connrefused --wait=10 -O "$f" "https://github.com/$repo/raw/refs/heads/master/$f"
          done

      - name: Download titledb_filtered
        run: |
          git clone --depth 1 https://github.com/masagrator/titledb_filtered.git
          git clone --depth 1 https://github.com/masagrator/version_dump.git
      
      # 5. Run your Python script
      - name: Install libraries
        run: |
          pip install requests

      - name: Extract data from eshops
        run: |
          python -u extractdatajp.py
          python -u extractdatahk.py
          python -u extractdataus.py
          python -u extractdataeu.py
      
      - name: Push data to repo to so we can ignore huge commits with no new titles
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add --ignore-removal scrap/
          git commit -m "Update data" || exit 0
          git push

      - name: Process new extracted data
        run: |
          python -u ProcessToTitleids.py
          python -u region_check.py

      # 6. Commit and push the files from the "output" folder
      - name: Push new files to repository
        run: |
          git add --ignore-removal output/
          git commit -m "Add new titles" || exit 0
          git push
